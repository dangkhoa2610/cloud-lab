version: '3.8'

services:
  # Câu 81: Khai báo Service backend
  backend:
    build: ./mern-demo/server
    # Câu 83: Cấu hình Port cho Backend
    ports:
      - "5000:5000"
    # Câu 85: Cấu hình biến môi trường
    environment:
      - MONGO_URI=mongodb+srv://cloud-lab:cloudlab123@cluster0.dddq94r.mongodb.net/cloud-lab?appName=Cluster0
      - MONGODB_URI=mongodb+srv://cloud-lab:cloudlab123@cluster0.dddq94r.mongodb.net/cloud-lab?appName=Cluster0

  # Câu 82: Khai báo Service frontend
  frontend:
    build: ./mern-demo/client
    # Câu 84: Cấu hình Port cho Frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend